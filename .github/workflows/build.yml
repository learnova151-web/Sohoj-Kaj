name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build whisper.cpp
        shell: bash
        run: |
          git clone --depth 1 --branch v1.7.5 https://github.com/ggml-org/whisper.cpp whisper-src
          cmake -S whisper-src -B whisper-src/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=OFF -DWHISPER_BUILD_SERVER=OFF -DGGML_BUILD_TESTS=OFF
          cmake --build whisper-src/build --config Release --target whisper-cli -j 4
          mkdir -p app/resources/whisper
          if [ -f whisper-src/build/bin/Release/whisper-cli.exe ]; then
            cp whisper-src/build/bin/Release/whisper-cli.exe app/resources/whisper/
            cp whisper-src/build/bin/Release/*.dll app/resources/whisper/ 2>/dev/null || true
          else
            cp whisper-src/build/bin/whisper-cli app/resources/whisper/
          fi
          ls -la app/resources/whisper

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Build installers
        working-directory: app
        run: npm run dist -- ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            app/release/*.dmg
            app/release/*.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/release/*.dmg
            app/release/*.exe
