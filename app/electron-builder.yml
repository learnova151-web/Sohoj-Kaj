appId: com.sohojkaj.app
productName: Sohoj Kaj
directories:
  output: release
  buildResources: build
files:
  - src/**/*
  - preload.js
  - package.json
extraResources:
  - from: resources/whisper
    to: whisper
    filter:
      - "**/*"
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
  identity: null
  artifactName: Sohoj-Kaj-${os}-${arch}.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: Sohoj Kaj uses the microphone to turn your speech into text.
    NSAppleEventsUsageDescription: Sohoj Kaj types the transcribed text into the app you are using.
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Sohoj-Kaj-${os}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
